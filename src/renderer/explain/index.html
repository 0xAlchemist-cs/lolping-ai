<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>lolPing explain</title>
  <link rel="stylesheet" href="explain.css" />
</head>
<body>
  <main class="card">
    <header class="titlebar">
      <span class="emblem" aria-hidden="true">?</span>
      <div class="heading">
        <p id="subtitle" class="eyebrow"></p>
        <h1 id="title">Ask about this</h1>
      </div>
      <button id="close" type="button" aria-label="Close">✕</button>
    </header>
    <div class="visionToolbar">
      <button id="previewOpen" type="button" hidden disabled></button>
      <button id="previewClose" type="button" hidden></button>
    </div>
    <section id="textView" class="textView">
      <p id="textModeLabel" class="modeLabel"></p>
      <div id="emptyState" class="emptyState">
        <p id="emptyTitle" class="emptyTitle"></p>
        <p id="emptyHint" class="emptyHint"></p>
      </div>
      <section id="setup" class="setup" hidden>
        <p id="setupTitle" class="setupTitle"></p>
        <p id="setupHint" class="setupHint"></p>
        <button id="openSettings" type="button"></button>
      </section>
      <article id="answer" class="answer" hidden>
        <div id="body"></div>
      </article>
      <section id="failure" class="failure" hidden>
        <p id="failureTitle" class="failureTitle"></p>
        <p id="failureText" class="failureText"></p>
        <button id="retry" type="button"></button>
      </section>
      <p id="hint" class="hint" role="status" aria-live="polite"></p>
      <form id="ask">
        <input id="question" type="text" autocomplete="off" spellcheck="false" maxlength="200" />
        <button id="send" type="submit">Ask</button>
        <button id="stop" type="button" hidden>Stop</button>
      </form>
      <footer>
        <button id="copy" type="button" disabled>Copy</button>
        <span id="copied"></span>
      </footer>
    </section>
    <section id="visionView" class="visionView" hidden>
      <div class="visionIntro">
        <p id="visionPrivacy" class="visionPrivacy"></p>
        <p id="visionTiming" class="hint"></p>
        <p id="visionStatus" class="hint" role="status" aria-live="polite"></p>
      </div>
      <div id="visionImages" class="visionImages" hidden>
        <figure>
          <figcaption id="visionLocalCaption"></figcaption>
          <div class="visionImage">
            <img id="visionLocal" alt="" draggable="false" />
            <span id="visionLocalMarker" class="visionMarker" role="img"></span>
          </div>
        </figure>
        <figure>
          <figcaption id="visionFullCaption"></figcaption>
          <div class="visionImage">
            <img id="visionFull" alt="" draggable="false" />
            <span id="visionFullMarker" class="visionMarker" role="img"></span>
          </div>
        </figure>
      </div>
      <div class="visionConsent">
        <div class="visionDetails">
          <label><input id="visionIncludeFull" type="checkbox" /> <span id="visionIncludeFullLabel"></span></label>
          <p id="visionSelection" class="hint"></p>
          <p id="visionDestination" class="hint"></p>
          <p id="visionUploadPrivacy" class="visionPrivacy"></p>
        </div>
        <div class="visionComposer">
          <input id="visionQuestion" type="text" autocomplete="off" spellcheck="false" maxlength="200" />
          <button id="visionSend" type="button" disabled></button>
        </div>
      </div>
    </section>
    <div class="windowHint"><span id="resizeHint"></span><span class="resizeGrip" aria-hidden="true"></span></div>
  </main>
  <script type="module" src="main.ts"></script>
</body>
</html>
